name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        python: ['3.12.3', '3.12']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src/cyberpilot_autotune
      - run: python -m tests.audit.validate_observability
      - run: python -m tests.audit.validate_observation_v2
      - run: python -m pytest -q
      - run: python -m pytest --cov=cyberpilot_autotune --cov-report=term-missing --cov-fail-under=90
      - run: python -m coverage report --include="*/safety/*" --fail-under=95
      - run: python -m coverage report --include="*/core/residual.py" --fail-under=95
      - run: python -m coverage report --include="*/replay/*" --fail-under=95
      - run: python -m coverage report --include="*/adapters/carrot_receipt_contract.py" --fail-under=95
      - name: Verify pinned synthetic golden evidence across fresh processes
        run: python -m pytest tests/integration/test_replay_golden.py tests/integration/test_replay_focused.py -q
      - run: python -m cyberpilot_autotune.replay.cli verify-all tests/fixtures/replay
      - run: python -m build
      - name: Install wheel in isolated environment and import outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          if [ "$RUNNER_OS" = "Windows" ]; then
            wheel_python="$RUNNER_TEMP/wheel-env/Scripts/python.exe"
          else
            wheel_python="$RUNNER_TEMP/wheel-env/bin/python"
          fi
          "$wheel_python" -m pip install --no-deps dist/*.whl
          fixture_directory="$GITHUB_WORKSPACE/tests/fixtures/replay"
          contract_fixture="$GITHUB_WORKSPACE/tests/fixtures/carrot_v2.py"
          cd "$RUNNER_TEMP"
          "$wheel_python" -I -c "import cyberpilot_autotune, pkgutil, importlib; [importlib.import_module(m.name) for m in pkgutil.walk_packages(cyberpilot_autotune.__path__, 'cyberpilot_autotune.')]"
          "$wheel_python" -I -m cyberpilot_autotune.replay.cli verify-all "$fixture_directory"
          "$wheel_python" -I -c "import runpy, sys; from cyberpilot_autotune.adapters.carrot_receipt_contract import evaluate; fixture=runpy.run_path(sys.argv[1]); attempt, policy=fixture['complete'](); result=evaluate(attempt, policy, fixture['BASELINE']); assert result.snapshot.source_valid; assert result.snapshot.baseline_parameters == fixture['BASELINE']; assert result.snapshot.source_age_s == 0.1" "$contract_fixture"
