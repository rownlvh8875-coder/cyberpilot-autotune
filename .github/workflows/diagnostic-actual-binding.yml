name: Diagnostic actual binding
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  diagnostics:
    strategy:
      matrix:
        python: ['3.12.3', '3.12']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,research]"
      - name: Preserve complete portable behavior and isolated actual legacy types
        run: python -m pytest -q tests/diagnostics/actual_binding --cov=cyberpilot_autotune.diagnostics.actual_binding --cov-branch --cov-report=json:diagnostic-coverage.json
      - name: Enforce separate statement and branch floors without exclusions
        run: python -m tests.audit.validate_actual_binding_coverage diagnostic-coverage.json
      - run: python -m build
      - name: Verify archive packaging and installed vanilla wheel outside checkout
        shell: bash
        run: |
          python -c 'import tarfile, pathlib, zipfile; d=pathlib.Path("dist"); s=next(d.glob("*.tar.gz")); w=next(d.glob("*.whl")); assert any(n.endswith("/tests/fixtures/actual_binding/legacy_contracts.zip") for n in tarfile.open(s).getnames()); assert not any(n.startswith("tests/") or "legacy_contracts" in n or n.startswith("actual_binding/") for n in zipfile.ZipFile(w).namelist())'
          python -m venv "$RUNNER_TEMP/diagnostic-wheel-env"
          if [ "$RUNNER_OS" = "Windows" ]; then
            wheel_python="$RUNNER_TEMP/diagnostic-wheel-env/Scripts/python.exe"
          else
            wheel_python="$RUNNER_TEMP/diagnostic-wheel-env/bin/python"
          fi
          "$wheel_python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$wheel_python" -I "$GITHUB_WORKSPACE/tests/wheel_actual_binding_smoke.py" --checkout "$GITHUB_WORKSPACE"
