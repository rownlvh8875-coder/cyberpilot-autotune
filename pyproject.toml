[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberpilot-autotune"
version = "0.1.0a4"
description = "Independent fail-closed shadow-only controller tuning research"
readme = "README.md"
requires-python = ">=3.12.3,<3.13"
dependencies = []

[project.optional-dependencies]
research = ["numpy>=2.2,<3"]
dev = [
  "pytest>=8,<10", "pytest-cov>=5,<8", "hypothesis>=6,<7",
  "ruff>=0.17.3,<0.18", "mypy>=1.15,<3", "build>=1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cyberpilot_autotune = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["cyberpilot_autotune"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 2

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/cyberpilot_autotune"]

[[tool.mypy.overrides]]
module = ["capnp", "openpilot.*"]
ignore_missing_imports = true
