[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "native-e-local-research"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "hypothesis>=6,<7", "ruff>=0.17.3,<0.18", "mypy>=1.15,<3", "build>=1,<2"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
native_e_lab = ["supervisor.c", "domain_supervisor.c", "domain_worker.c"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
strict = true
[tool.coverage.run]
branch = true
source = ["native_e_lab"]
[tool.coverage.report]
show_missing = true
